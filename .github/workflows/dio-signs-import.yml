name: DIO sign DWG audit and pilot

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of DWGs in the stratified review batch
        type: choice
        default: '64'
        options: ['32', '64', '128', 'all']
  push:
    branches: [main]
    paths:
      - tools/dio-signs-import/**
      - .github/workflows/dio-signs-import.yml
      - dio/files/Otevrene_soubory_dwg_VL_6.1_vcetne_informace.zip

permissions:
  contents: read

concurrency:
  group: dio-signs-import
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  audit:
    if: github.repository == 'PObdr/pobdr.github.io'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Initialize output directories
        run: |
          echo "DIO_OUT=$RUNNER_TEMP/dio-signs-output" >> "$GITHUB_ENV"
          echo "DWG_PREFIX=$RUNNER_TEMP/libredwg-bin" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dio-signs-output"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/dio-signs-import/requirements.txt
      - name: Prepare Python renderer
        run: |
          python -m pip install -r tools/dio-signs-import/requirements.txt
          python -m pip freeze > "$DIO_OUT/python-packages.txt"
          sha256sum dio/fonts/Bahnschrift.ttf > "$DIO_OUT/project-font.sha256"
      - name: Test import, MTEXT repair and actual filled SVG extraction
        run: python -m unittest discover -s tools/dio-signs-import -p 'test*.py'
      - name: Inventory checked-out DWG ZIP
        run: >-
          python tools/dio-signs-import/import_signs.py inventory
          --archive "dio/files/Otevrene_soubory_dwg_VL_6.1_vcetne_informace.zip"
          --output "$DIO_OUT"
      - uses: actions/cache@v4
        id: dwg-cache
        with:
          path: ${{ env.DWG_PREFIX }}
          key: dio-libredwg-0.13.3-ubuntu22-x64-static-v1
      - name: Build pinned DWG reader on cache miss
        if: steps.dwg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libtool autoconf automake
          mkdir -p "$RUNNER_TEMP/libredwg-source" "$DWG_PREFIX"
          curl --fail --location --retry 3 --max-time 180 \
            https://ftp.gnu.org/gnu/libredwg/libredwg-0.13.3.tar.xz \
            --output "$RUNNER_TEMP/libredwg.tar.xz"
          sha256sum "$RUNNER_TEMP/libredwg.tar.xz" > "$DWG_PREFIX/source.sha256"
          tar -xf "$RUNNER_TEMP/libredwg.tar.xz" -C "$RUNNER_TEMP/libredwg-source" --strip-components=1
          cd "$RUNNER_TEMP/libredwg-source"
          ./configure --prefix="$DWG_PREFIX" --disable-bindings --disable-docs --disable-shared
          make -j2
          make install
      - name: Record converter and activate binary path
        run: |
          echo "$DWG_PREFIX/bin" >> "$GITHUB_PATH"
          "$DWG_PREFIX/bin/dwgread" --version > "$DIO_OUT/converter-version.txt"
          sha256sum "$DWG_PREFIX/bin/dwgread" > "$DIO_OUT/converter-binary.sha256"
          cp "$DWG_PREFIX/source.sha256" "$DIO_OUT/libredwg-source.sha256"
      - name: Render larger comparison batch with two isolated workers
        env:
          PILOT_LIMIT: ${{ inputs.limit || '64' }}
        run: |
          if [ "$PILOT_LIMIT" = 'all' ]; then PILOT_LIMIT=0; fi
          python tools/dio-signs-import/cad_review.py batch --output "$DIO_OUT" --limit "$PILOT_LIMIT"
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f "$DIO_OUT/summary.md" ]; then
            cat "$DIO_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Import incomplete; inspect artifacts. No sign models were published.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dio-signs-dwg-audit-${{ github.run_id }}
          path: ${{ env.DIO_OUT }}
          if-no-files-found: warn
          retention-days: 14
