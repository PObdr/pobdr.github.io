name: Refresh lighting and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lighting-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: dio/data/lamps
          key: lighting-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lighting-v1-
      - name: Install coordinate converter
        run: python -m pip install pyproj==3.7.1
      - name: Check source and build tiles
        run: python tools/build_lamps.py
      - uses: actions/cache/save@v4
        with:
          path: dio/data/lamps
          key: lighting-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy site including generated lamp tiles
        id: deploy
        uses: actions/deploy-pages@v4
